name: publish-kit

# Builds and publishes this lab's Docker Sandboxes kits (see the README):
#
#   mixin   sbx-kit/labsbx-dhi-launch-mixin.yaml   the lab's content kit
#                                                  -> ghcr.io/<owner>/labsbx-dhi-launch-mixin
#   set     labsbx-dhi-launch.yaml                 a kit set merging the Labspace kit, the Docker
#                                                  Scout kit and the content kit into one reference
#                                                  -> ghcr.io/<owner>/labsbx-dhi-launch
#
# The set runs after the mixin: its members are registry references, pinned by
# digest at build, so building it right after the mixin is published is what
# puts the new content in the set.
#
# Each kit is built by build-kit.yaml: on pull requests nothing is pushed (the
# kit is built to a local OCI layout and checked with kit-tck); on main it is
# published as :latest, :sha-<short> and, the first time, :<version>.

on:
  pull_request:
    paths:
      - "labspace/**"
      - "project/**"
      - "sbx-kit/**"
      - "labsbx-dhi-launch.yaml"
      - ".github/workflows/publish-kit.yaml"
      - ".github/workflows/build-kit.yaml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-kit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mixin:
    uses: ./.github/workflows/build-kit.yaml
    permissions:
      contents: read
      packages: write
    with:
      name: labsbx-dhi-launch-mixin
      descriptor: sbx-kit/labsbx-dhi-launch-mixin.yaml
      # The repository root, so the kit carries labspace/ and project/.
      context: .

  set:
    needs: mixin
    uses: ./.github/workflows/build-kit.yaml
    permissions:
      contents: read
      packages: write
    with:
      name: labsbx-dhi-launch
      descriptor: labsbx-dhi-launch.yaml
